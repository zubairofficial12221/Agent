<!DOCTYPE html>
<html>

<head>
    <title>Nova AI</title>
    <style>
    body{
        margin:0;
        height: 100vh;
        display:grid;
        place-item:center;
        background:#09090b;
        color:white;
        font-family:Arial;
}
    .card{
        width:300px;
        padding:35px;
        text-align:center;
        background:#151518;
        border:1px solid #333;
        border-radius:25px;
    }

    .mic{
        width:90px;
        height:90px;
        border:0;
        border-radius:50%;
        font-size:35px;
        cursor:pointer;
    }

    .status{

        margin-top:20px;
        color:#aaa;
    }

    .song{
        margin-top:10;
        font-size:13px;
    }

    .listening{
        transform:scale(1,1);
        box-shadow:0 0 0 10px #ffffff18;
    }


</style>
    
</head>

<body>
    <div class="card">
        <h2>Nova AI</h2>
        <p>say a song name</p>
        <button id = "mic" class="mic"></button>

        <div id =  "status" class = "status">
            tap microphone
        </div>

        <div id ="song" class = "song"></div>
    </div>

    <h1>🤖 Nova AI</h1>

    <h2>✅ Backend Connected Successfully</h2>

    <p>Flask server is running.</p>

</body>

</html>
